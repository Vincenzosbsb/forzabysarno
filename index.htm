<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORZA THE GAME, by Sarno</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .game-container {
            position: relative;
            width: 600px;
            height: 200px;
            border: 2px solid black;
            margin: auto;
            overflow: hidden;
            background: url('images/Fuorigrotta.jpg') no-repeat center center/cover;
        }
        .dino {
            width: 50px;
            height: 50px;
            background: url('images/1f9e0.png') no-repeat center center/contain;
            position: absolute;
            bottom: 0;
            left: 50px;
        }
        .obstacle {
            width: 40px;
            height: 40px;
            background: url('images/7ASBz47Eq9BA7ldabQRnNR.png') no-repeat center center/contain;
            position: absolute;
            bottom: 0;
            right: 0;
            animation: moveObstacle 2s linear infinite;
        }
        @keyframes moveObstacle {
            from { right: 0; }
            to { right: 600px; }
        }
        .touch-control {
            width: 100%;
            height: 100px;
            background: rgba(0, 0, 0, 0.1);
            position: fixed;
            bottom: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <h1>FORZA THE GAME, by Sarno</h1>
    <p>Premi SPAZIO o tocca lo schermo per saltare</p>
    <p>Punteggio: <span id="score">0</span></p>
    <div class="game-container">
        <div class="dino" id="dino"></div>
        <div class="obstacle" id="obstacle"></div>
    </div>
    <p id="gameOver" style="display: none; font-size: 20px; color: red;">Game Over! <button onclick="restartGame()">Ricomincia</button></p>
    <div class="touch-control" onclick="jump()"></div>
    <button onclick="playMusic()">Avvia Musica</button>
    <audio id="background-music" loop>
        <source src="images/forza.mp3" type="audio/mpeg">
    </audio>
    <script>
        let dino = document.getElementById("dino");
        let obstacle = document.getElementById("obstacle");
        let scoreElement = document.getElementById("score");
        let gameOverText = document.getElementById("gameOver");
        let isJumping = false;
        let score = 0;
        let music = document.getElementById("background-music");
        music.volume = 0.5;

        function playMusic() {
            music.play();
        }

        document.addEventListener("keydown", function(event) {
            if (event.code === "Space" && !isJumping) {
                jump();
            }
        });

        function jump() {
            if (isJumping) return;
            isJumping = true;
            let position = 0;
            let upInterval = setInterval(() => {
                if (position >= 80) {
                    clearInterval(upInterval);
                    let downInterval = setInterval(() => {
                        if (position <= 0) {
                            clearInterval(downInterval);
                            isJumping = false;
                        }
                        dino.style.bottom = position + "px";
                        position -= 5;
                    }, 20);
                }
                dino.style.bottom = position + "px";
                position += 5;
            }, 20);
        }

        function checkCollision() {
            let dinoRect = dino.getBoundingClientRect();
            let obstacleRect = obstacle.getBoundingClientRect();
            
            if (
                dinoRect.right > obstacleRect.left &&
                dinoRect.left < obstacleRect.right &&
                dinoRect.bottom > obstacleRect.top
            ) {
                gameOver();
            }
        }

        function gameOver() {
            obstacle.style.animation = "none";
            gameOverText.style.display = "block";
            clearInterval(scoreInterval);
        }

        function restartGame() {
            location.reload();
        }

        let scoreInterval = setInterval(() => {
            score++;
            scoreElement.innerText = score;
            checkCollision();
        }, 100);
    </script>
</body>
</html>
